[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new25-acoustic"
version = "0.5.0"
description = "Shared 25-language acoustic model with HiFi-GAN, FARGAN and selected RNDVoC vocoders"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
hifigan = ["scipy>=1.11,<2"]
fargan = ["scipy>=1.11,<2"]
rndvoc = ["scipy>=1.11,<2", "librosa>=0.10.2,<0.12"]
postprocess = ["scipy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["new25_acoustic*", "new25_hifigan*", "new25_fargan*", "new25_rndvoc*", "new25_postprocess*"]

[tool.setuptools.package-data]
new25_postprocess = [
