[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new25-acoustic"
version = "0.1.0"
description = "Trained shared 25-language acoustic model with a reserved vocoder interface"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["new25_acoustic*"]
